[package]
name = "app-tracking"
version = "0.4.0"
description = "Update checks, usage counters, and verified downloads for developer tools"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cli", "updates", "version", "cache"]
categories = ["command-line-interface", "development-tools"]
include = ["src/**", "examples/**", "fixtures/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["parsing"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
