[package]
name = "app-tracking"
version = "0.6.1"
description = "Update checks, usage counters, and verified downloads for developer tools"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "crates/app-tracking/README.md"
keywords = ["cli", "updates", "version", "cache"]
categories = ["command-line-interface", "development-tools"]
include = [
  "crates/app-tracking/src/**",
  "crates/app-tracking/examples/**",
  "crates/app-tracking/fixtures/**",
  "crates/app-tracking/README.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[lib]
path = "crates/app-tracking/src/lib.rs"

[[example]]
name = "background-consumer"
path = "crates/app-tracking/examples/background-consumer.rs"

[[example]]
name = "telemetry-consumer"
path = "crates/app-tracking/examples/telemetry-consumer.rs"

[[example]]
name = "unified-client-fixture"
path = "crates/app-tracking/examples/unified-client-fixture.rs"

[[example]]
name = "update-consumer"
path = "crates/app-tracking/examples/update-consumer.rs"

[[example]]
name = "cli-integration"
path = "crates/app-tracking/examples/cli-integration.rs"

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["parsing"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }

[workspace]
members = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian-software/app-tracking"
authors = ["Sebastian Software GmbH"]

[workspace.lints.rust]
# Unsafe is denied everywhere except the audited Windows process-start boundary.
# Stable std::process cannot disable inherited handles at the workspace MSRV.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
