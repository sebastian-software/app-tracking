[workspace]
members = ["crates/app-tracking"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian-software/app-tracking"
authors = ["Sebastian Software GmbH"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
