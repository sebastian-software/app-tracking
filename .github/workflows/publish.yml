name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing public release tag to resume after a failed registry publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-tracking-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created || steps.recovery.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.recovery.outputs.tag_name }}
    steps:
      - name: Maintain release PR and create GitHub release
        if: github.event_name == 'push' || inputs.recover_tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Validate an existing release for recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recover_tag != ''
        id: recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.recover_tag }}
        shell: bash
        run: |
          [[ "$TAG_NAME" =~ ^app-tracking-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$TAG_NAME" --json isPrerelease --jq '.isPrerelease')" = false
          echo 'release_created=true' >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  publish-crate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    defaults:
      run:
        working-directory: release
    steps:
      - name: Check out the release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          persist-credentials: false
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: release/.node-version
          package-manager-cache: false
      - name: Read MSRV from Cargo.toml
        id: rust
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = /^rust-version = "([0-9.]+)"$/m.exec(readFileSync('Cargo.toml', 'utf8'))?.[1];
          if (!version) throw new Error('Missing workspace rust-version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: rustup toolchain install '${{ steps.rust.outputs.version }}' --profile minimal
      - name: Package and verify the released source
        run: cargo +${{ steps.rust.outputs.version }} package --locked -p app-tracking
      - name: Check whether this exact package is already published
        id: package
        run: node ../automation/scripts/check-crate-release.ts
      - name: Authenticate with crates.io
        if: steps.package.outputs.publish_required == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        if: steps.package.outputs.publish_required == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +${{ steps.rust.outputs.version }} publish --locked -p app-tracking
      - name: Verify the registry checksum
        run: node ../automation/scripts/check-crate-release.ts --require-published

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    defaults:
      run:
        working-directory: release
    steps:
      - name: Check out the release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          persist-credentials: false
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: release/.node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Check whether the tag includes a public Node package
        id: node-package
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          const file = 'packages/node-client/package.json';
          const eligible = existsSync(file) && JSON.parse(readFileSync(file, 'utf8')).private !== true;
          appendFileSync(process.env.GITHUB_OUTPUT, `eligible=${eligible}\n`);
          if (!eligible) console.log('This legacy release predates the public Node package.');
          JS
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        if: steps.node-package.outputs.eligible == 'true'
        with:
          package_json_file: release/package.json
          run_install: false
          cache: true
          cache_dependency_path: release/pnpm-lock.yaml
      - name: Install release build dependencies
        if: steps.node-package.outputs.eligible == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned npm CLI for Trusted Publishing
        if: steps.node-package.outputs.eligible == 'true'
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Build and test the npm artifact
        if: steps.node-package.outputs.eligible == 'true'
        run: pnpm test:node-client
      - name: Pack the npm release
        if: steps.node-package.outputs.eligible == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack ./packages/node-client --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/node-client/package.json', 'utf8')).version")"
          echo "NPM_ARCHIVE=$RUNNER_TEMP/npm-release/sebastian-software-app-tracking-$version.tgz" >> "$GITHUB_ENV"
      - name: Check whether this exact package is already published
        if: steps.node-package.outputs.eligible == 'true'
        id: package
        run: node ../automation/scripts/check-node-release.ts "$NPM_ARCHIVE"
      - name: Publish with npm Trusted Publishing
        if: steps.package.outputs.publish_required == 'true'
        run: npm publish "$NPM_ARCHIVE" --access public --tag latest --provenance
      - name: Verify the registry integrity
        if: steps.node-package.outputs.eligible == 'true'
        run: node ../automation/scripts/check-node-release.ts "$NPM_ARCHIVE" --require-published
