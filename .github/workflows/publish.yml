name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing public release tag to resume after a failed crate publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-tracking-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.recovery.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.recovery.outputs.tag_name }}
    steps:
      - name: Maintain release PR and create GitHub release
        if: github.event_name == 'push' || inputs.recover_tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Validate an existing release for recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recover_tag != ''
        id: recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.recover_tag }}
        shell: bash
        run: |
          [[ "$TAG_NAME" =~ ^app-tracking-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$TAG_NAME" --json isPrerelease --jq '.isPrerelease')" = false
          echo 'release_created=true' >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  publish-crate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    defaults:
      run:
        working-directory: release
    steps:
      - name: Check out the release automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: automation
          persist-credentials: false
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: release/.node-version
          package-manager-cache: false
      - name: Read MSRV from Cargo.toml
        id: rust
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = /^rust-version = "([0-9.]+)"$/m.exec(readFileSync('Cargo.toml', 'utf8'))?.[1];
          if (!version) throw new Error('Missing workspace rust-version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: rustup toolchain install '${{ steps.rust.outputs.version }}' --profile minimal
      - name: Package and verify the released source
        run: cargo +${{ steps.rust.outputs.version }} package --locked -p app-tracking
      - name: Check whether this exact package is already published
        id: package
        run: node ../automation/scripts/check-crate-release.ts
      - name: Authenticate with crates.io
        if: steps.package.outputs.publish_required == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crate
        if: steps.package.outputs.publish_required == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +${{ steps.rust.outputs.version }} publish --locked -p app-tracking
      - name: Verify the registry checksum
        run: node ../automation/scripts/check-crate-release.ts --require-published
