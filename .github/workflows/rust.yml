name: Rust client
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Read MSRV from Cargo.toml
        id: rust
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = /^rust-version = "([0-9.]+)"$/m.exec(readFileSync('Cargo.toml', 'utf8'))?.[1];
          if (!version) throw new Error('Missing workspace rust-version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: rustup toolchain install '${{ steps.rust.outputs.version }}' --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ steps.rust.outputs.version }} fmt --all --check
      - run: cargo +${{ steps.rust.outputs.version }} clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +${{ steps.rust.outputs.version }} test --locked --workspace
      - name: Verify canonical bytes with consumer-enabled JSON insertion order
        run: cargo +${{ steps.rust.outputs.version }} test --locked --workspace --features serde_json/preserve_order telemetry::tests::payloads_match_golden
      - run: cargo +${{ steps.rust.outputs.version }} build --locked --examples
      - run: node scripts/check-rust-consumer.ts
      - run: node scripts/check-rust-telemetry.ts
      - run: node scripts/check-rust-background.ts
      - run: cargo +${{ steps.rust.outputs.version }} doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +${{ steps.rust.outputs.version }} package --locked -p app-tracking
