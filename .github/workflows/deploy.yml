name: Deploy app-tracking
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      storage_proof:
        description: Run the temporary synthetic Bunny–PlanetScale integration proof
        required: false
        type: boolean
        default: false
      ingestion_test:
        description: Test the gated ingestion handler against PlanetScale with synthetic data
        required: false
        type: boolean
        default: false
      production_proof:
        description: Verify the production composition on a temporary authenticated Bunny endpoint
        required: false
        type: boolean
        default: false
      release_run:
        description: Successful release run to restore; leave empty to deploy main
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: version-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && !inputs.storage_proof && !inputs.ingestion_test && !inputs.production_proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEMETRY_ENABLED: ${{ vars.APP_TRACKING_TELEMETRY_ENABLED == '1' && '1' || '0' }}
      REPORTING_ENABLED: ${{ vars.APP_TRACKING_REPORTING_ENABLED == '1' && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Configure Bunny service
        id: target
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          SCRIPT_NAME: app-tracking
          ZONE_NAME: sebastian-app-tracking
        run: node scripts/provision.ts
      - name: Configure isolated telemetry runtime
        if: inputs.release_run == ''
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.APP_TRACKING_MIGRATION_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.APP_TRACKING_RUNTIME_DATABASE_URL }}
          MIGRATION_OWNER_ROLE: app_tracking_owner
        run: node scripts/configure-telemetry.ts
      - name: Configure isolated maintainer reporting
        if: inputs.release_run == ''
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.APP_TRACKING_MIGRATION_DATABASE_URL }}
          MIGRATION_OWNER_ROLE: app_tracking_owner
          REPORTING_DATABASE_URL: ${{ secrets.APP_TRACKING_REPORTING_DATABASE_URL }}
          ADMIN_TOKEN_HASHES: ${{ secrets.APP_TRACKING_ADMIN_TOKEN_HASHES }}
        run: node scripts/configure-reporting.ts
      - name: Publish and verify
        if: inputs.release_run == ''
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOYMENT_BASE: ${{ steps.target.outputs.base }}
        run: |
          node scripts/release.ts
          node scripts/verify-deployment.ts
          if [ "$TELEMETRY_ENABLED" = "1" ]; then node scripts/verify-telemetry.ts; fi
      - name: Restore a previously verified bundle
        if: inputs.release_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/restore-artifact.ts
      - name: Retain verified release for rollback
        if: inputs.release_run == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: |
            dist/edge.js
            dist/release.json
          retention-days: 90
          if-no-files-found: error
      - name: Retry cleanup of this run's synthetic identity
        if: always()
        run: node scripts/verify-telemetry.ts --cleanup

  storage-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.storage_proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.PROOF_MIGRATION_DATABASE_URL }}
      RUNTIME_DATABASE_URL: ${{ secrets.PROOF_RUNTIME_DATABASE_URL }}
      RUNTIME_ROLE: ${{ secrets.PROOF_RUNTIME_ROLE }}
      MIGRATION_OWNER_ROLE: app_tracking_owner
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove database migrations, constraints, locks, and rollback
        run: |
          for attempt in 1 2 3; do
            pnpm test:storage
          done
      - name: Build isolated probe
        run: node scripts/storage/build-proof.ts
      - name: Publish temporary probe and verify real HTTP driver
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/storage/run-proof.ts
      - name: Remove temporary probe after failure or cancellation
        if: always()
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/storage/cleanup-proof.ts
      - name: Retain sanitized measurements
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-proof-results
          path: dist/storage-proof-results.json
          retention-days: 30
          if-no-files-found: error

  ingestion-test:
    if: github.event_name == 'workflow_dispatch' && inputs.ingestion_test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.APP_TRACKING_MIGRATION_DATABASE_URL }}
      RUNTIME_DATABASE_URL: ${{ secrets.APP_TRACKING_RUNTIME_DATABASE_URL }}
      MIGRATION_OWNER_ROLE: app_tracking_owner
      INGESTION_HTTP_DRIVER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read MSRV from Cargo.toml
        id: rust
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = /^rust-version = "([0-9.]+)"$/m.exec(readFileSync('Cargo.toml', 'utf8'))?.[1];
          if (!version) throw new Error('Missing workspace rust-version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: rustup toolchain install '${{ steps.rust.outputs.version }}' --profile minimal
      - run: cargo +${{ steps.rust.outputs.version }} build --locked --examples
      - name: Verify gated ingestion using real PlanetScale HTTP calls
        run: |
          node scripts/storage/check-runtime.ts
          node scripts/storage/test-ingestion.ts
          node scripts/storage/test-rust-telemetry.ts
      - name: Verify authenticated scheduled-maintenance command
        run: node scripts/storage/run-retention.ts

  production-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.production_proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Verify effective query logging
        env:
          RUNTIME_DATABASE_URL: ${{ secrets.APP_TRACKING_RUNTIME_DATABASE_URL }}
        run: node scripts/storage/check-runtime.ts
      - name: Verify the shared Bunny runtime with owned synthetic reports
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          RUNTIME_DATABASE_URL: ${{ secrets.APP_TRACKING_RUNTIME_DATABASE_URL }}
        run: node scripts/storage/run-runtime-proof.ts
      - name: Verify scheduled retention and deletion health
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.APP_TRACKING_MIGRATION_DATABASE_URL }}
        run: |
          node scripts/storage/run-retention.ts
          node scripts/storage/check-operations.ts
      - name: Retry fixture cleanup
        if: always()
        run: node scripts/verify-telemetry.ts --cleanup
      - name: Remove this run's temporary Bunny endpoint
        if: always()
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/storage/cleanup-proof.ts
