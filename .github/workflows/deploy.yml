name: Deploy version service
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful release run to restore; leave empty to deploy main
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: version-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Configure Bunny service
        id: target
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          SCRIPT_NAME: app-tracking
          ZONE_NAME: sebastian-app-tracking
        run: node scripts/provision.ts
      - name: Publish and verify
        if: inputs.release_run == ''
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOYMENT_BASE: ${{ steps.target.outputs.base }}
        run: |
          node scripts/release.ts
          node scripts/verify-deployment.ts
      - name: Restore a previously verified bundle
        if: inputs.release_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/restore-artifact.ts
      - name: Retire the temporary bootstrap test deployment
        if: inputs.release_run == ''
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { bunnyApi, required } from './scripts/bunny.ts';
          const api = bunnyApi(required('BUNNY_API_KEY'));
          const path = '/compute/script?search=app-tracking-staging&type=1&includeLinkedPullzones=true&perPage=100&page=1';
          const list = await api('GET', path);
          if (list.Items.length >= 100) throw new Error('Unexpected bootstrap discovery size');
          const matches = list.Items.filter(s => s.Name === 'app-tracking-staging');
          if (matches.length > 1) throw new Error('Ambiguous bootstrap target');
          if (matches.length === 1) {
            const script = await api('GET', `/compute/script/${matches[0].Id}`);
            const zones = script.LinkedPullZones;
            if (zones?.length !== 1 || zones[0].PullZoneName !== 'sebastian-app-tracking-staging')
              throw new Error('Unexpected bootstrap links');
            await api('DELETE', `/compute/script/${script.Id}?deleteLinkedPullZones=true`);
          }
          const after = await api('GET', path);
          if (after.Items.some(s => s.Name === 'app-tracking-staging'))
            throw new Error('Bootstrap test deployment still exists');
          console.log('Temporary bootstrap test deployment retired.');
          JS
      - name: Retain verified release for rollback
        if: inputs.release_run == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: |
            dist/edge.js
            dist/release.json
          retention-days: 90
          if-no-files-found: error
