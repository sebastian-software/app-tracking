name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Keep browser dependencies stable during the ubuntu-latest image transition.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Release Please plans with the action's implementation version
        env:
          RELEASE_PLEASE_MODULE: ${{ runner.temp }}/release-please/node_modules/release-please
        run: |
          npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-save --no-audit --no-fund release-please@17.6.0
          node scripts/check-release-plan.mjs
      - run: pnpm check
      - name: Verify the reporting interface with synthetic data
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/check-reporting-browser.ts
      - name: Retain synthetic reporting screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporting-browser-evidence
          path: dist/reporting-evidence
          retention-days: 14
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create scoped migration and runtime roles
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_tracking_owner NOLOGIN;
          CREATE ROLE app_tracking_migrator LOGIN;
          CREATE ROLE app_tracking_runtime LOGIN;
          CREATE ROLE app_tracking_reporter LOGIN;
          GRANT app_tracking_owner TO app_tracking_migrator;
          ALTER ROLE app_tracking_runtime SET statement_timeout = '2500ms';
          ALTER ROLE app_tracking_runtime SET lock_timeout = '1500ms';
          SQL
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE app_tracking OWNER app_tracking_owner;'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE app_tracking_restore OWNER app_tracking_owner;'
          psql -X -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON DATABASE app_tracking_restore FROM PUBLIC; GRANT CONNECT ON DATABASE app_tracking_restore TO app_tracking_migrator,app_tracking_runtime;'
          psql -X -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON DATABASE app_tracking FROM PUBLIC; GRANT CONNECT ON DATABASE app_tracking TO app_tracking_migrator,app_tracking_runtime;'
      - name: Read MSRV from Cargo.toml
        id: rust
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = /^rust-version = "([0-9.]+)"$/m.exec(readFileSync('Cargo.toml', 'utf8'))?.[1];
          if (!version) throw new Error('Missing workspace rust-version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: rustup toolchain install '${{ steps.rust.outputs.version }}' --profile minimal
      - run: cargo +${{ steps.rust.outputs.version }} build --locked --examples
      - name: Test real PostgreSQL storage
        env:
          MIGRATION_DATABASE_URL: postgresql://app_tracking_migrator@localhost/app_tracking?sslmode=disable
          MIGRATION_OWNER_ROLE: app_tracking_owner
          RUNTIME_DATABASE_URL: postgresql://app_tracking_runtime@localhost/app_tracking?sslmode=disable
          RUNTIME_ROLE: app_tracking_runtime
          REPORTING_DATABASE_URL: postgresql://app_tracking_reporter@localhost/app_tracking?sslmode=disable
          REPORTING_ROLE: app_tracking_reporter
          RESTORE_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pnpm test:storage
          node scripts/storage/test-rust-telemetry.ts
