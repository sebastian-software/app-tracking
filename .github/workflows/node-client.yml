name: Node client
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - name: Install Rust MSRV for cross-runtime fixtures
        shell: bash
        run: |
          version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; process.stdout.write(/^rust-version = \"([^\"]+)\"$/m.exec(readFileSync('Cargo.toml', 'utf8'))[1])")
          rustup toolchain install "$version" --profile minimal
          rustup override set "$version"
      - run: cargo build --locked --example unified-client-fixture
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:node-client
