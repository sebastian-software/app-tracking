name: Project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site-browser.ts"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-site-browser.ts"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-site-browser.ts
      - name: Retain website screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: project-website-evidence
          path: dist/site-evidence
          retention-days: 14
      - name: Package only the public website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
