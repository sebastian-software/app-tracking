name: Project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site-browser.ts"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-site-browser.ts"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-site-browser.ts
      - name: Retain website screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-website-evidence
          path: dist/site-evidence
          retention-days: 14
      - name: Package only the public website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
